# Append to postgresql.conf (or `include` this file from it) on srv-db.
#
# Tuned for: sustained streaming ingestion at a 10,000 TPS target (2026
# stress test showed the original 74/188 msg/s-avg/peak Zevent 2025
# baseline undersold real demand by ~50x — see README's "Scaling to 10k
# TPS" section). Ingestion is now COPY-to-staging + bulk merge every
# 1-2s (see insert_example.sql), not the old 10-15min batch cadence this
# file was previously sized for.
#
# Hardware: srv-db is 4 cores / 16GB RAM / 96GB disk — RAM upgraded from
# 7.8GB to 16GB on 2026-09-02 (confirmed, not assumed); cores and disk are
# unchanged. There is still no headroom for a large max_wal_size the way a
# bigger *disk* would allow: at a genuine 10k rows/s sustained, raw+index
# data alone grows ~16.7GB/hour (see README's "Scaling to 10k TPS"
# section), so WAL sizing has to share the same 96GB disk with that data,
# not just tolerate a slower checkpoint cadence in isolation. Disk
# *capacity*, not CPU/RAM/insert speed, is still this box's actual
# constraint at a sustained 10k TPS target — insert-path throughput was
# already validated well past 10k rows/s in testing even on the old 7.8GB
# spec, so the RAM bump doesn't change the bottleneck analysis. It does
# remove the headroom pressure that capped shared_buffers/effective_cache_size
# and PgBouncer's pool size below — those are sized up accordingly.

shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 32MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9

# Modest increase over the original 4GB/15min, not the aggressive
# scale-up a bigger box would get: max_wal_size competes directly with
# raw/index data for the same 96GB disk at this ingest rate, so it's
# capped by capacity, not by what would minimize checkpoint I/O in
# isolation.
max_wal_size = 6GB
checkpoint_timeout = 20min
wal_compression = on

# Deliberately `local`, not `off`: this project's backup/restore chain
# (backup.sh, restore_test.sh) is specifically built and tested around
# trusting the WAL for everything since the last base backup, and group
# commit below recovers most of the throughput `off` would have bought
# without giving up "committed = durable on this node."
synchronous_commit = local

# Group commit: at high concurrent commit rates, batches multiple
# transactions' fsyncs into one by letting a commit wait a fraction of a
# millisecond for siblings to catch up. With many concurrent NiFi
# batch-merge transactions committing close together (the expected
# shape at 10k TPS), this trades a small fixed latency for a large
# reduction in fsync count — the actual ceiling on sustained commit
# rate on any single disk. Tune commit_delay down if p99 latency matters
# more than raw throughput; there's no benefit if batches end up
# committing from a single connection instead of many concurrent ones.
commit_delay = 1000                     # microseconds
commit_siblings = 5

maintenance_work_mem = 1GB
random_page_cost = 1.1                  # SSD

# Insert-only tables (raw.*) never trigger vacuum under the
# delete/update-driven scale factor below, since there are no dead
# tuples to reclaim — only the freeze map needs maintaining. Without an
# insert-specific threshold, PG only vacuums them at wraparound-driven
# emergency thresholds, which is a much bigger stall than doing it
# incrementally. autovacuum_vacuum_insert_scale_factor (PG13+) covers
# that; kept low precisely because raw ingestion is now high-volume.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_vacuum_insert_scale_factor = 0.02
autovacuum_naptime = 15s

# COPY-to-staging ingestion means fewer, fatter connections doing bulk
# work rather than many thin ones doing single-row inserts — the
# concurrency benchmark that hit >50k rows/s used 20 connections, so 100
# is headroom for that plus background workers, not a target to fill.
# Kept below the original 200: even at 16GB RAM, connections that do
# become active each cost work_mem (32MB), and PgBouncer's pool below is
# sized to match this, not the other way around.
max_connections = 100

# Minimal WAL archiving for backup/restore — see backup.sh / restore_test.sh.
# wal_level=replica is PG15's default; set explicitly since archiving depends on it.
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /archive/wal/%f && cp %p /archive/wal/%f'
