; PgBouncer sits between NiFi (up to 1000 virtual connections) and
; PostgreSQL (capped at 50 real ones) so a burst of concurrent NiFi
; batch-merge transactions queues in PgBouncer instead of exhausting
; PostgreSQL connections. Sized for the 10k TPS target (COPY-to-staging +
; merge, see insert_example.sql) against the REAL srv-db spec (4 cores /
; 16GB RAM, upgraded from 7.8GB on 2026-09-02 — confirmed, not assumed).
; 50 real connections is 2.5x the 20 that hit >50k rows/s in testing,
; leaving headroom under postgresql.tuning.conf's max_connections=100 for
; background workers (autovacuum, checkpointer, WAL writer) without
; over-committing work_mem — comfortable at 16GB of RAM where it was tight
; at 7.8GB (hence the original 40-connection cap).
;
; Deployed to /etc/pgbouncer/pgbouncer.ini as of 2026-09-01; default_pool_size
; was bumped 40→50 here on 2026-09-02 for the RAM upgrade and still needs
; `sudo systemctl reload pgbouncer` on srv-db to take effect there.
; Still NOT what the local docker-compose sandbox runs: that container
; (edoburu/pgbouncer, see docker-compose.yml) generates its own config
; from the DATABASE_URLS env var on every start and never reads this
; file — this file is the source of truth for srv-db only. Add/remove
; databases here, then `sudo systemctl reload pgbouncer` on srv-db.
;
; auth_type = scram-sha-256, not md5: pg_hba.conf on srv-db (PostgreSQL
; 16) requires scram-sha-256, and password_encryption there is
; scram-sha-256 by default — an md5-hashed userlist.txt entry can't
; satisfy that handshake. userlist.txt stores the real plaintext
; password (not a hash pulled from pg_shadow — a stored SCRAM verifier
; can't be used to authenticate *as* the user, only to check someone
; else's proof, so PgBouncer needs the plaintext to log into Postgres
; itself). See the real deployment note in userlist.txt.example.

[databases]
zevent = host=127.0.0.1 port=5432 dbname=zevent user=zevent_user
zevent-dev = host=127.0.0.1 port=5432 dbname=zevent-dev user=zevent_user

; Separate virtual databases for zevent_readonly (added 2026-09-03), rather
; than dropping user= above: zevent/zevent-dev force every backend
; connection to zevent_user regardless of which login authenticated, so a
; readonly client connecting to those names would silently run queries as
; zevent_user (full CRUD) instead of being enforced read-only by Postgres.
; These entries force user=zevent_readonly instead, leaving the zevent_user
; CRUD path above completely untouched.
zevent-ro = host=127.0.0.1 port=5432 dbname=zevent user=zevent_readonly
zevent-dev-ro = host=127.0.0.1 port=5432 dbname=zevent-dev user=zevent_readonly

[pgbouncer]
ignore_startup_parameters = extra_float_digits
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
reserve_pool_size = 10
server_lifetime = 3600
client_idle_timeout = 900

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

; Not functional yet: zevent_admin has no userlist.txt entry (no Postgres
; role backs it — it's a PgBouncer-console-only identity, not something
; pg_shadow can generate a secret for). Admin console access is a
; follow-up, not required for NiFi/dbt connectivity through zevent/zevent-dev.
admin_users = zevent_admin
